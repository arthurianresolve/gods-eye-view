name: Windows profile recovery diagnostic

on:
  push:
    branches: [qa/windows-recovery-diagnostic]
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload the bounded recovery report and command logs
        type: boolean
        default: false

concurrency:
  group: windows-profile-recovery-diagnostic-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-profile-recovery:
    name: Five-stage Windows recovery (${{ matrix.backend }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: swiftshader-gl-driver
            webgl_only: '0'
          - backend: swiftshader-webgl-only
            webgl_only: '1'
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_QA_SOFTWARE_RENDERING: '1'
      GEV_PROFILE_RECOVERY_DIAGNOSTICS: '1'
      GEV_QA_SWIFTSHADER_WEBGL_ONLY: ${{ matrix.webgl_only }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: node scripts/pinokio-install.mjs

      - name: Test startup diagnostic bounds and redaction
        run: node --test scripts/performance/startupDiagnostics.test.mjs

      - name: Install fixture browser
        run: npx puppeteer browsers install chrome

      - name: Run all five real recovery stages
        run: node scripts/qa-profile-recovery.mjs --out qa-artifacts/profile-recovery-diagnostic-${{ matrix.backend }}.json

      - name: Preserve recovery evidence
        if: always() && inputs.upload_artifacts == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-profile-recovery-diagnostic-${{ matrix.backend }}
          path: qa-artifacts/profile-recovery-diagnostic-${{ matrix.backend }}*
          retention-days: 30

      - name: Recovery evidence in job logs
        if: always()
        run: node scripts/print-qa-evidence.mjs qa-artifacts/profile-recovery-diagnostic-${{ matrix.backend }}.json
