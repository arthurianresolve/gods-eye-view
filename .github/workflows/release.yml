name: Versioned release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/stage-release.mjs'
      - 'scripts/verify-release.mjs'
      - 'scripts/qa-candidate.mjs'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Artifact channel
        type: choice
        options: [dev]
        default: dev
        required: true
      publish_stable:
        description: Promote a verified candidate (run on its version tag)
        type: boolean
        default: false
      validation_manifest:
        description: Exact-commit pre-release validation manifest JSON with external evidence URLs
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build and verify release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run format:check
          npm run check:boundaries
          npm test
          npm run build

      - name: Require complete exact-commit acceptance before promotion
        if: inputs.publish_stable
        env:
          VALIDATION_MANIFEST: ${{ inputs.validation_manifest }}
          GEV_VALIDATION_MANIFEST: ${{ runner.temp }}/validation-manifest.json
          GEV_CANDIDATE_URL: http://localhost:4173
          GEV_VALIDATION_PHASE: pre-release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.env.GEV_VALIDATION_MANIFEST, process.env.VALIDATION_MANIFEST)'
          npx vite --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/release-preview.log" 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 2
          done
          npm run qa:candidate -- --out "$RUNNER_TEMP/candidate-readiness.json"

      - name: Stage versioned manifest and checksummed files
        env:
          RELEASE_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || inputs.channel || 'dev' }}
        run: node scripts/stage-release.mjs --out release-staging --channel "$RELEASE_CHANNEL" --commit "$GITHUB_SHA"

      - name: Verify staged release and source commit
        run: |
          node scripts/verify-release.mjs --path release-staging
          test "$(jq -r .commit release-staging/gev-release-manifest.json)" = "$GITHUB_SHA"

      - name: Create reproducible archive and checksum
        run: |
          ARCHIVE="gods-eye-view-${GITHUB_SHA}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C release-staging -cf - . | gzip -n > "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Generate release artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'gods-eye-view-*.tar.gz'

      - name: Upload candidate artifact for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gev-candidate-${{ github.sha }}
          path: |
            gods-eye-view-*.tar.gz
            gods-eye-view-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Download candidate artifact for verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gev-candidate-${{ github.sha }}
          path: downloaded-release

      - name: Verify downloaded archive and attestation before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_NAME="gods-eye-view-${GITHUB_SHA}.tar.gz"
          pushd downloaded-release >/dev/null
          sha256sum -c "${ARCHIVE_NAME}.sha256"
          gh attestation verify "$ARCHIVE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners > attestation-verification.txt
          VERIFY_DIR="$(mktemp -d)"
          tar -xzf "$ARCHIVE_NAME" -C "$VERIFY_DIR"
          popd >/dev/null
          node scripts/verify-release.mjs --path "$VERIFY_DIR"
          test "$(jq -r .commit "$VERIFY_DIR/gev-release-manifest.json")" = "$GITHUB_SHA"

      - name: Create or update an unpublished tag candidate
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_VERSION"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          if gh release view "$RELEASE_VERSION" --json isDraft > "$RUNNER_TEMP/release-state.json"; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release-state.json")" = true
            gh release upload "$RELEASE_VERSION" "downloaded-release/gods-eye-view-${GITHUB_SHA}.tar.gz" "downloaded-release/gods-eye-view-${GITHUB_SHA}.tar.gz.sha256" --clobber
          else
            gh release create "$RELEASE_VERSION" "downloaded-release/gods-eye-view-${GITHUB_SHA}.tar.gz" "downloaded-release/gods-eye-view-${GITHUB_SHA}.tar.gz.sha256" --verify-tag --generate-notes --draft
          fi

      - name: Verify draft release download and promote only after acceptance
        if: inputs.publish_stable && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_VERSION" --dir published-verification --pattern "gods-eye-view-${GITHUB_SHA}.tar.gz*"
          cd published-verification
          sha256sum -c "gods-eye-view-${GITHUB_SHA}.tar.gz.sha256"
          gh attestation verify "gods-eye-view-${GITHUB_SHA}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          cmp "gods-eye-view-${GITHUB_SHA}.tar.gz" "../downloaded-release/gods-eye-view-${GITHUB_SHA}.tar.gz"
          git fetch --no-tags origin "refs/tags/$RELEASE_VERSION"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          gh release edit "$RELEASE_VERSION" --draft=false --latest

      - name: Retain candidate validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gev-release-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/candidate-readiness.json
            ${{ runner.temp }}/validation-manifest.json
            downloaded-release/attestation-verification.txt
          if-no-files-found: ignore
