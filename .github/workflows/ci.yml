          {"status":"not-run","scope":"isolated hosted ownership diagnostic, not physical desktop or heap-soak acceptance","error":"Terrain/picking runner did not complete."}
          JSON
      - name: Install locked dependencies and fixture browser
        run: npm ci
      - name: Run bounded terrain and picking ownership cycles
        run: node scripts/qa-terrain-picking-lifecycle.mjs --out qa-artifacts/terrain-picking-lifecycle.json
      - name: Print diagnostic evidence
        if: always()
        run: node scripts/print-qa-evidence.mjs --artifact-only qa-artifacts/terrain-picking-lifecycle.json
      - name: Preserve diagnostic evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terrain-picking-lifecycle-${{ github.run_id }}
          path: qa-artifacts/terrain-picking-lifecycle.json
          if-no-files-found: warn
          retention-days: 3

  tracking-regression:
    if: (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'tracking-regression') || (github.event_name == 'pull_request' && github.event.pull_request.number == 9)
    name: Aircraft tracking regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out immutable diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install locked dependencies and fixture browser
        run: |
          npm ci
          npx puppeteer browsers install chrome
      - name: Run existing tracking regressions with bundled imagery
        shell: bash
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD | tee qa-artifacts/tracking-source.txt
          git status --porcelain --untracked-files=no | tee qa-artifacts/tracking-source-status.txt
          npx vite --host 127.0.0.1 --port 4174 --strictPort > qa-artifacts/tracking-server.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4174/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat qa-artifacts/tracking-server.log; exit 1; fi
          node scripts/track-regression.mjs --url http://localhost:4174 --offline-imagery 2>&1 | tee qa-artifacts/tracking-regression.log
      - name: Preserve regression evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracking-regression-${{ github.run_id }}
          path: qa-artifacts/tracking-*
          if-no-files-found: warn
          retention-days: 3

  mission-render-demand:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'mission-render-demand'
    name: Isolated mission render-demand correctness
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Initialize failure evidence before browser setup
        run: |
          mkdir -p qa-artifacts
          cat > qa-artifacts/mission-render-demand.json <<'JSON'
          {"schema":"gev-mission-render-demand/v1","status":"not-run","scope":"isolated hosted correctness and rendered-work comparison, not physical desktop or full-application performance acceptance","error":"Mission render-demand runner did not complete."}
          JSON
      - name: Install locked dependencies
        run: npm ci
      - name: Run bounded mission render-demand comparison
        run: node scripts/qa-mission-render-demand.mjs --out qa-artifacts/mission-render-demand.json
      - name: Print diagnostic evidence
        if: always()
        run: node scripts/print-qa-evidence.mjs qa-artifacts/mission-render-demand.json
      - name: Preserve diagnostic evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mission-render-demand-${{ github.run_id }}
          path: qa-artifacts/mission-render-demand*
          if-no-files-found: warn
          retention-days: 3

  mixed-use-smoke:
    name: Isolated rendered mixed-use smoke
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'mixed-use-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_FAIL_ON_RETRY: 1
    steps:
      - name: Check out immutable diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install locked dependencies and fixture browser
        run: |
          npm ci
          npx puppeteer browsers install chrome
      - name: Start fixture application
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/mixed-use-source.txt
          git status --porcelain > qa-artifacts/mixed-use-source-status.txt
          npx vite --host 127.0.0.1 --port 4174 --strictPort > qa-artifacts/mixed-use-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:4174/ > /dev/null && exit 0
            sleep 1
          done
          cat qa-artifacts/mixed-use-server.log
          exit 1
      - name: Run the existing bounded mixed-use smoke
        run: |
          set -o pipefail
          npm run qa:mixed-use-soak -- --url http://localhost:4174 --duration-ms 10000 --out qa-artifacts/mixed-use-smoke.json 2>&1 | tee qa-artifacts/mixed-use-smoke.log
      - name: Run durable workspace library and cross-page conflict journey
        run: npm run qa:workspaces -- --url http://localhost:4174
      - name: Run opt-in full-application empty-layer render-demand diagnostic
        if: inputs.application_render_demand
        run: |
          set -o pipefail
          npm run qa:application -- --url http://localhost:4174 --render-demand 2>&1 | tee qa-artifacts/mixed-use-render-demand.log
      - name: Preserve the report including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mixed-use-smoke-${{ github.run_id }}
          path: qa-artifacts/mixed-use-*
          retention-days: 3

  rendered-soak:
    name: 60-minute rendered application soak
    if: github.event_name == 'workflow_dispatch' && inputs.full_soak && inputs.validation_mode == 'standard'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies and fixture browser
        run: npm ci
      - name: Start application
        run: |
          npx vite --host 127.0.0.1 --port 4174 --strictPort > application.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4174/ > /dev/null && exit 0
            sleep 2
          done
          cat application.log
          exit 1
      - name: Run full rendered soak
        run: npm run qa:mixed-use-soak -- --url http://localhost:4174 --out qa-artifacts/rendered-soak.json
      - name: Preserve soak evidence
        if: always() && inputs.upload_artifacts == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered-soak
          path: |
            qa-artifacts/
            application.log
          retention-days: 30
      - name: Soak evidence in job logs
        if: always()
        run: node scripts/print-qa-evidence.mjs qa-artifacts/rendered-soak.json

  hosted-gpu-probe:
    name: Native WebGL probe (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && (inputs.hosted_gpu_probe || inputs.validation_mode == 'hosted-native-probe') && inputs.validation_mode != 'hosted-macos-soak' && inputs.validation_mode != 'performance-build-smoke' && inputs.validation_mode != 'import-workspace-lifecycle' && inputs.validation_mode != 'cctv-lifecycle' && inputs.validation_mode != 'mission-render-demand' && inputs.validation_mode != 'tracking-regression' && inputs.validation_mode != 'mixed-use-smoke' && inputs.validation_mode != 'terrain-picking-lifecycle'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - run: npm ci
      - name: Probe default renderer without forcing software or bypassing GPU blocks
        run: node scripts/qa-hosted-capture.mjs

  hosted-macos-soak:
    name: Free hosted Mac accelerated retention diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'hosted-macos-soak'
    runs-on: macos-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - run: npm ci
      - name: Verify acceleration and run bounded project soak
        run: node scripts/qa-hosted-capture.mjs --soak
      - name: Preserve original hosted soak envelope including cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-soak-${{ github.run_id }}
          path: qa-artifacts/hosted-native-renderer.json
          if-no-files-found: warn
          retention-days: 3

  hosted-collection-probe:
    name: Free hosted Mac rendering diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'hosted-collection-probe'
    runs-on: macos-latest
    timeout-minutes: ${{ inputs.renderer_diagnostic == 'import-point-benefit' && 45 || inputs.renderer_diagnostic == 'traffic' && 20 || 10 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - run: npm ci
      - name: Prepare the exact traffic baseline
        if: inputs.renderer_diagnostic == 'traffic'
        run: |
          git fetch --no-tags origin 4dfea32b4e63c0d28d22cd031e61e290e81f6f2a
          git worktree add --detach "$RUNNER_TEMP/gev-traffic-baseline" 4dfea32b4e63c0d28d22cd031e61e290e81f6f2a
          npm ci --prefix "$RUNNER_TEMP/gev-traffic-baseline"
      - name: Run selected project diagnostic with verified acceleration
        env:
          DIAGNOSTIC: ${{ inputs.renderer_diagnostic || 'collections' }}
          BASELINE_SHA: 4dfea32b4e63c0d28d22cd031e61e290e81f6f2a
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          if [ "$DIAGNOSTIC" = "traffic" ]; then
            node scripts/performance/trafficRenderDemandComparison.mjs "$RUNNER_TEMP/gev-traffic-baseline" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/qa-artifacts/traffic-render-demand"
          elif [ "$DIAGNOSTIC" = "import-point-benefit" ]; then
            node scripts/performance/importPointRepresentationBenefit.mjs
          else
            node scripts/qa-hosted-capture.mjs --"$DIAGNOSTIC"
          fi
      - name: Preserve renderer comparison evidence
        if: always() && (inputs.renderer_diagnostic == 'infrastructure' || inputs.renderer_diagnostic == 'infrastructure-datacenters' || inputs.renderer_diagnostic == 'vessels' || inputs.renderer_diagnostic == 'calibration' || inputs.renderer_diagnostic == 'viewshed-retention')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.renderer_diagnostic }}-comparison-${{ github.run_id }}
          path: qa-artifacts/hosted-native-renderer.json
          if-no-files-found: error
          retention-days: 3
      - name: Preserve import point benefit evidence after success or failure
        if: always() && inputs.renderer_diagnostic == 'import-point-benefit'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: import-point-benefit-${{ github.run_id }}
          path: qa-artifacts/import-point-benefit
          if-no-files-found: error
          retention-days: 3
      - name: Preserve traffic evidence after success or failure
        if: always() && inputs.renderer_diagnostic == 'traffic'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: traffic-comparison-${{ github.run_id }}
          path: qa-artifacts/traffic-render-demand
          if-no-files-found: error
          retention-days: 3
      - name: Remove the owned traffic baseline checkout
        if: always() && inputs.renderer_diagnostic == 'traffic'
        run: git worktree remove --force "$RUNNER_TEMP/gev-traffic-baseline"
