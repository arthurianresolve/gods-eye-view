      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Initialize failure evidence before browser setup
        run: |
          mkdir -p qa-artifacts
          cat > qa-artifacts/cctv-lifecycle.json <<'JSON'
          {"schema":"gev-cctv-lifecycle/v2","status":"not-run","scope":"short hosted software-rendered ownership diagnostic, not a hardware or heap-soak acceptance result","cases":[],"error":"Lifecycle runner did not complete."}
          JSON
      - name: Install locked dependencies and fixture browser
        run: |
          npm ci
          npx puppeteer browsers install chrome
      - name: Run bounded CCTV ownership cycles
        run: |
          mkdir -p qa-artifacts
          npx vite --host 127.0.0.1 --port 4174 --strictPort > qa-artifacts/cctv-lifecycle-server.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4174/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat qa-artifacts/cctv-lifecycle-server.log; exit 1; fi
          node scripts/qa-cctv-lifecycle.mjs --url http://localhost:4174 --cycles 5 --drain-ms 10000 --out qa-artifacts/cctv-lifecycle.json
      - name: Print diagnostic evidence
        if: always()
        run: node scripts/print-qa-evidence.mjs qa-artifacts/cctv-lifecycle.json
      - name: Preserve diagnostic evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cctv-lifecycle-${{ github.run_id }}
          path: qa-artifacts/cctv-lifecycle.json
          if-no-files-found: warn
          retention-days: 3

  terrain-picking-lifecycle:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'terrain-picking-lifecycle'
    name: Isolated terrain and picking lifecycle
    runs-on: macos-latest
