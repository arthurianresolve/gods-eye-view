name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Full validation, hosted diagnostics, or performance build smoke
        type: choice
        options:
          [
            standard,
            hosted-native-probe,
            hosted-macos-soak,
            hosted-collection-probe,
            performance-build-smoke,
            import-workspace-lifecycle,
            mission-render-demand,
            windows-profile-recovery,
          ]
        default: standard
      full_soak:
        description: Run the 60-minute rendered application acceptance soak
        type: boolean
        default: false
      renderer_diagnostic:
        description: Workload for the isolated hosted Mac diagnostic
        type: choice
        options: [collections, wind]
        default: collections
      hosted_gpu_probe:
        description: Probe native WebGL on free standard hosted runners
        type: boolean
        default: false
      candidate_sha:
        description: Full immutable application SHA for the performance build smoke
        type: string
        required: false
        default: ''
      capture_worker_audit_mode:
        description: Keep worker auditing diagnostic, or restore it before capture warmup
        type: choice
        options: [diagnostic, prewarm]
        default: diagnostic
      upload_artifacts:
        description: Upload extra evidence artifacts (otherwise evidence stays in job logs)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A new push must not cancel a manually started soak of a frozen commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.validation_mode || github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: inputs.validation_mode != 'hosted-macos-soak' && inputs.validation_mode != 'hosted-native-probe' && inputs.validation_mode != 'hosted-collection-probe' && inputs.validation_mode != 'performance-build-smoke' && inputs.validation_mode != 'import-workspace-lifecycle' && inputs.validation_mode != 'mission-render-demand' && inputs.validation_mode != 'windows-profile-recovery'
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Check published layer-token allocations
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: npm run layer-token:check -- --base-ref "origin/$BASE_REF"

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  street-level-browser:
    if: inputs.validation_mode != 'hosted-macos-soak' && inputs.validation_mode != 'hosted-native-probe' && inputs.validation_mode != 'hosted-collection-probe' && inputs.validation_mode != 'performance-build-smoke' && inputs.validation_mode != 'import-workspace-lifecycle' && inputs.validation_mode != 'mission-render-demand' && inputs.validation_mode != 'windows-profile-recovery'
    # Hermetic: every Mapillary request is answered from fixtures, so the
    # dummy token below never leaves the page.
    name: Street Level browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
      # Fail on a missed header press unless the panel itself moved.
      QA_FAIL_ON_RETRY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies and headless Chrome
        run: npm ci

      - name: Build production bundle with a dummy Mapillary token
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: npm run build

      - name: Start the preview server
        env:
          MAPILLARY_CLIENT_TOKEN: 'MLY|0|qa-fixture'
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Street Level gate with Mapillary fixtures
        run: npm run qa:street-level:fixtures -- --strict --url http://localhost:4173

      - name: Start the application lifecycle fixture server
        if: success() || failure()
        run: |
          npx vite --host 127.0.0.1 --port 4174 --strictPort > lifecycle.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4174/ > /dev/null && exit 0
            sleep 2
          done
          cat lifecycle.log
          exit 1

      - name: First-use application lifecycle gate
        if: success() || failure()
        run: npm run qa:application -- --url http://localhost:4174

      - name: Evidence references and browser-profile transfer
        if: success() || failure()
        run: npm run qa:references -- --url http://localhost:4174

      - name: Keyboard, accessible names and reflow
        if: success() || failure()
        run: npm run qa:accessibility -- --url http://localhost:4174

      - name: Effective visual settings across share and workspace restores
        if: success() || failure()
        run: node scripts/qa-visual-settings.mjs --url http://localhost:4174

      - name: Rendered application mixed-use smoke
        if: success() || failure()
        run: npm run qa:mixed-use-soak -- --url http://localhost:4174 --duration-ms 10000 --out qa-artifacts/mixed-use-smoke.json

      - name: Scene import and sharing gate
        if: success() || failure()
        env:
          QA_BASE_URL: http://localhost:4173
        run: npm run qa:director-sharing

      - name: Aircraft evidence panel gate
        if: success() || failure()
        run: npm run qa:evidence-panel -- --url http://localhost:4173

      - name: Portable panel gate
        if: success() || failure()
        run: npm run qa:panel-resize -- --url http://localhost:4173

      - name: Preview server log
        if: failure()
        run: cat preview.log

      - name: Upload gate evidence
        if: failure() && inputs.upload_artifacts == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-gate-evidence
          path: |
            qa-artifacts/
            qa-shots/director-sharing/
          if-no-files-found: ignore
          retention-days: 14

  windows-onboarding:
    if: inputs.validation_mode != 'hosted-macos-soak' && inputs.validation_mode != 'hosted-native-probe' && inputs.validation_mode != 'hosted-collection-probe' && inputs.validation_mode != 'performance-build-smoke' && inputs.validation_mode != 'import-workspace-lifecycle' && inputs.validation_mode != 'mission-render-demand' && inputs.validation_mode != 'windows-profile-recovery'
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/keySetupHardening.test.mjs src/codexOauthRealtime.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs

      - name: Build production bundle
        run: npm run build

  install-recovery:
    if: inputs.validation_mode != 'hosted-macos-soak' && inputs.validation_mode != 'hosted-native-probe' && inputs.validation_mode != 'hosted-collection-probe' && inputs.validation_mode != 'performance-build-smoke' && inputs.validation_mode != 'import-workspace-lifecycle' && inputs.validation_mode != 'mission-render-demand'
    name: Install and update recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.validation_mode == 'windows-profile-recovery' && '["windows-latest"]' || '["windows-latest","macos-latest","ubuntu-latest"]') }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      # Exercise recovery with a deterministic software renderer on GPU-less bots.
      # This job does not contribute hardware/performance acceptance evidence.
      GEV_QA_SOFTWARE_RENDERING: '1'
      # Windows install recovery uses the measured WebGL-only SwiftShader path.
      # Keep the full-driver software renderer available on other OS jobs.
      GEV_QA_SWIFTSHADER_WEBGL_ONLY: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Clean install
        run: node scripts/pinokio-install.mjs

      - name: Exercise real Git update paths with disposable repositories
        run: node --test src/pinokioUpdatePreview.test.mjs

      - name: Reject incomplete artifacts and reopen portable workspaces
        run: npm run qa:install-recovery

      - name: Install fixture browser
        run: npx puppeteer browsers install chrome

      - name: Upgrade and recover a real installation and browser profile
        run: node scripts/qa-profile-recovery.mjs --out qa-artifacts/profile-recovery.json

      - name: Preserve recovery evidence
        if: always() && inputs.upload_artifacts == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-recovery-${{ matrix.os }}
          path: qa-artifacts/profile-recovery*
          retention-days: 30
      - name: Recovery evidence in job logs
        if: always()
        run: node scripts/print-qa-evidence.mjs qa-artifacts/profile-recovery.json

  performance-build-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'performance-build-smoke'
    name: Baseline-compatible performance build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out harness and reachable commits
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Initialize bounded smoke artifact and clock
        run: |
          mkdir -p "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/performance-build-smoke.json" <<'JSON'
          {"schema":"gev-performance-build-smoke/v1","scope":"hosted-browser integration smoke only; no hardware performance result or paired acceptance","status":"not-run","failure":{"phase":"runner-setup","message":"Smoke script did not complete."}}
          JSON
          echo "GEV_PERF_SMOKE_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Install harness dependencies and headless Chrome
        run: |
          npm ci
          npx puppeteer browsers install chrome

      - name: Build and inspect both immutable application revisions
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CAPTURE_WORKER_AUDIT_MODE: ${{ inputs.capture_worker_audit_mode || 'diagnostic' }}
        run: >-
          node scripts/qa-performance-build-smoke.mjs
          --candidate-sha "$CANDIDATE_SHA"
          --capture-worker-audit-mode "$CAPTURE_WORKER_AUDIT_MODE"
          --out "$RUNNER_TEMP/performance-build-smoke.json"

      - name: Print bounded smoke evidence
        if: always()
        run: |
          evidence="$RUNNER_TEMP/performance-build-smoke.json"
          if [ -f "$evidence" ]; then
            cat "$evidence"
          else
            echo 'Performance build smoke report was not created.'
          fi

      - name: Preserve smoke evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-build-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/performance-build-smoke.json
          if-no-files-found: warn
          retention-days: 3

  import-workspace-lifecycle:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'import-workspace-lifecycle'
    name: Isolated import and workspace lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_QA_SOFTWARE_RENDERING: '1'
      GEV_QA_SWIFTSHADER_WEBGL_ONLY: '1'
    steps:
      - name: Check out immutable diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Initialize failure evidence before browser setup
        run: |
          mkdir -p qa-artifacts
          cat > qa-artifacts/import-workspace-lifecycle.json <<'JSON'
          {"schema":"gev-import-workspace-lifecycle/v1","status":"not-run","scope":"short hosted software-rendered ownership diagnostic, not a hardware or heap-soak acceptance result","cases":[],"error":"Lifecycle runner did not complete."}
          JSON
      - name: Install locked dependencies and fixture browser
        run: |
          npm ci
          npx puppeteer browsers install chrome
      - name: Run bounded isolated ownership cases
        run: |
          mkdir -p qa-artifacts
          npx vite --host 127.0.0.1 --port 4174 --strictPort > qa-artifacts/lifecycle-server.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4174/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat qa-artifacts/lifecycle-server.log; exit 1; fi
          node scripts/qa-import-workspace-lifecycle.mjs --url http://localhost:4174 --cycles 5 --drain-ms 10000 --out qa-artifacts/import-workspace-lifecycle.json
      - name: Print diagnostic evidence
        if: always()
        run: node scripts/print-qa-evidence.mjs qa-artifacts/import-workspace-lifecycle.json
      - name: Preserve diagnostic evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: import-workspace-lifecycle-${{ github.run_id }}
          path: qa-artifacts/import-workspace-lifecycle.json
          if-no-files-found: warn
          retention-days: 3

  mission-render-demand:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'mission-render-demand'
    name: Isolated mission render-demand correctness
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Initialize failure evidence before browser setup
        run: |
          mkdir -p qa-artifacts
          cat > qa-artifacts/mission-render-demand.json <<'JSON'
          {"schema":"gev-mission-render-demand/v1","status":"not-run","scope":"isolated hosted correctness and rendered-work comparison, not physical desktop or full-application performance acceptance","error":"Mission render-demand runner did not complete."}
          JSON
      - name: Install locked dependencies
        run: npm ci
      - name: Run bounded mission render-demand comparison
        run: node scripts/qa-mission-render-demand.mjs --out qa-artifacts/mission-render-demand.json
      - name: Print diagnostic evidence
        if: always()
        run: node scripts/print-qa-evidence.mjs qa-artifacts/mission-render-demand.json
      - name: Preserve diagnostic evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mission-render-demand-${{ github.run_id }}
          path: qa-artifacts/mission-render-demand*
          if-no-files-found: warn
          retention-days: 3

  rendered-soak:
    name: 60-minute rendered application soak
    if: github.event_name == 'workflow_dispatch' && inputs.full_soak && inputs.validation_mode == 'standard'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies and fixture browser
        run: npm ci
      - name: Start application
        run: |
          npx vite --host 127.0.0.1 --port 4174 --strictPort > application.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4174/ > /dev/null && exit 0
            sleep 2
          done
          cat application.log
          exit 1
      - name: Run full rendered soak
        run: npm run qa:mixed-use-soak -- --url http://localhost:4174 --out qa-artifacts/rendered-soak.json
      - name: Preserve soak evidence
        if: always() && inputs.upload_artifacts == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered-soak
          path: |
            qa-artifacts/
            application.log
          retention-days: 30
      - name: Soak evidence in job logs
        if: always()
        run: node scripts/print-qa-evidence.mjs qa-artifacts/rendered-soak.json

  hosted-gpu-probe:
    name: Native WebGL probe (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && (inputs.hosted_gpu_probe || inputs.validation_mode == 'hosted-native-probe') && inputs.validation_mode != 'hosted-macos-soak' && inputs.validation_mode != 'performance-build-smoke' && inputs.validation_mode != 'import-workspace-lifecycle' && inputs.validation_mode != 'mission-render-demand'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - run: npm ci
      - name: Probe default renderer without forcing software or bypassing GPU blocks
        run: node scripts/qa-hosted-capture.mjs

  hosted-macos-soak:
    name: Free hosted Mac accelerated retention diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'hosted-macos-soak'
    runs-on: macos-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - run: npm ci
      - name: Verify acceleration and run bounded project soak
        run: node scripts/qa-hosted-capture.mjs --soak

  hosted-collection-probe:
    name: Free hosted Mac rendering diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'hosted-collection-probe'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - run: npm ci
      - name: Run selected project diagnostic with verified acceleration
        env:
          DIAGNOSTIC: ${{ inputs.renderer_diagnostic || 'collections' }}
        run: node scripts/qa-hosted-capture.mjs --"$DIAGNOSTIC"
