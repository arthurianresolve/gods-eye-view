<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vessel render-demand fixture</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #09141f;
      }
      #viewer {
        position: absolute;
        inset: 0;
      }
      .cesium-viewer-bottom {
        display: none;
      }
      #controls {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 10px;
        max-width: 430px;
        padding: 10px;
        color: #d8e6f2;
        background: rgb(5 15 25 / 92%);
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #result {
        max-height: 140px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <aside id="controls">
      <strong>Vessel render-demand diagnostic</strong>
      <p>
        Isolated AIS billboard layer. The fixture uses synthetic fixed vessel
        records and no external imagery or terrain.
      </p>
      <button id="run" type="button">Run this mode</button>
      <button id="download" type="button" disabled>Download JSON</button>
      <span id="status" role="status">Ready</span>
      <pre id="result"></pre>
    </aside>
    <script type="module" src="./vessel-render-demand.js"></script>
  </body>
</html>
