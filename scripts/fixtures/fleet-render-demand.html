<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S51 fleet render demand</title>
    <link
      rel="stylesheet"
      href="/node_modules/cesium/Build/Cesium/Widgets/widgets.css"
    />
    <style>
      html,
      body,
      #viewer {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07111b;
      }
      #panel {
        position: fixed;
        z-index: 5;
        top: 12px;
        left: 12px;
        width: min(440px, calc(100vw - 48px));
        padding: 12px;
        color: #d8e6f2;
        background: rgb(5 15 25 / 92%);
        border: 1px solid #2a536c;
        border-radius: 8px;
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      #status {
        min-height: 1.5em;
        margin: 6px 0;
      }
      #result {
        max-height: 140px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      button {
        color: inherit;
        background: #102638;
        border: 1px solid #39718c;
        border-radius: 4px;
        padding: 5px 8px;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="credits"></div>
    <aside id="panel">
      <strong>S51 actual fleet-layer comparison</strong>
      <p>
        Real CivilFlight/MilitaryFlight layers with deterministic local feeds.
        The hosted runner uses this same fixture against the frozen baseline and
        candidate source checkouts. No live provider data is used.
      </p>
      <button id="run" type="button" disabled>Run fixture</button>
      <button id="download" type="button" disabled>Download JSON</button>
      <div id="status" role="status" aria-live="polite">
        Loading fixture module
      </div>
      <pre id="result"></pre>
    </aside>
    <script type="module" src="./fleet-render-demand.mjs"></script>
  </body>
</html>
