<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCTV calibration render-demand fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-rows: 42px 42px minmax(0, 1fr) 76px;
        background: #09141f;
        color: #d9e8f0;
      }
      header,
      #instruction-area,
      footer {
        padding: 6px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header {
        border-bottom: 1px solid #27404e;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      button {
        color: inherit;
        background: #164054;
        border: 1px solid #39738c;
        border-radius: 4px;
        padding: 5px 12px;
      }
      button:disabled {
        opacity: 0.5;
      }
      #status {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #instruction-area {
        height: 42px;
        border-bottom: 1px solid #27404e;
      }
      #pointer-instruction {
        min-width: 0;
        font:
          12px ui-monospace,
          monospace;
        white-space: pre;
      }
      #viewer {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      #credits {
        position: absolute;
        left: -10000px;
        top: 0;
      }
      footer {
        align-items: flex-start;
        border-top: 1px solid #27404e;
      }
      #result {
        margin: 0;
        width: 100%;
        max-height: 64px;
        overflow: auto;
        white-space: pre-wrap;
        font:
          10px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>CCTV calibration render-demand diagnostic</h1>
      <button id="run" type="button">Run 5 paired trials</button>
      <button id="download" type="button" disabled>Download JSON</button>
      <span id="status" role="status">Ready</span>
    </header>
    <div id="instruction-area">
      <strong>Native pointer action:</strong>
      <span id="pointer-instruction" aria-live="polite"></span>
    </div>
    <div id="viewer"></div>
    <div id="credits"></div>
    <footer><pre id="result"></pre></footer>
    <script type="module" src="./cctv-calibration-demand.js"></script>
  </body>
</html>
