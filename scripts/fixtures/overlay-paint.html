<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S52 Canvas2D paint-equivalence stage</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #09141f;
      }
      #fixture-surface {
        position: fixed;
        inset: 0 auto auto 0;
        width: 800px;
        height: 600px;
        background: #09141f;
      }
      #cesiumContainer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #world-overlay-root,
      #world-overlay-detection-surface {
        position: absolute;
        inset: 0 auto auto 0;
        z-index: 6;
        pointer-events: none;
      }
      #world-overlay-canvas {
        position: absolute;
        inset: 0 auto auto 0;
        pointer-events: none;
      }
      #title-bar {
        position: fixed;
        z-index: 100;
        left: 0;
        top: 0;
        width: 245px;
        height: 72px;
        padding: 12px;
        color: white;
        background: #182b3c;
      }
      .world-overlay-accessibility {
        position: fixed;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      #result {
        position: fixed;
        right: 0;
        bottom: 0;
        z-index: 1000;
        max-width: 40vw;
        max-height: 20vh;
        overflow: auto;
        opacity: 0.02;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="fixture-surface"><div id="cesiumContainer"></div></div>
    <div id="title-bar">Deterministic UI occluder</div>
    <button id="run" type="button" hidden>Run visual stage</button>
    <pre id="result">pending</pre>
    <script type="module" src="./overlay-paint.mjs"></script>
  </body>
</html>
