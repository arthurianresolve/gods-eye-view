<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mission render-demand fixture</title>
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07111b;
      }
      .cesium-viewer-bottom {
        display: none;
      }
      #fixtureControls {
        position: fixed;
        z-index: 10;
        top: 12px;
        left: 12px;
        width: min(440px, calc(100vw - 48px));
        padding: 12px;
        color: #d8e6f2;
        background: rgb(5 15 25 / 92%);
        border: 1px solid #2a536c;
        border-radius: 8px;
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      #fixtureControls label {
        display: inline-grid;
        gap: 4px;
        margin: 0 8px 8px 0;
      }
      #fixtureControls button,
      #fixtureControls select {
        color: inherit;
        background: #102638;
        border: 1px solid #39718c;
        border-radius: 4px;
        padding: 5px 8px;
      }
      #status {
        min-height: 1.5em;
        margin: 6px 0;
      }
      #result {
        max-height: 180px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <aside id="fixtureControls">
      <strong>Mission render-demand diagnostic</strong>
      <p>
        Isolated Cesium mission layer; full application UI and world overlays
        are omitted. Keep this browser tab foregrounded and uncovered. Page
        focus/visibility does not verify desktop occlusion.
      </p>
      <label
        >Scenario
        <select id="scenario">
          <option value="static-empty">Empty, parked scene</option>
          <option value="unselected-orbit">Visible unselected orbits</option>
          <option value="selected-live">Selected live mission</option>
        </select>
      </label>
      <label
        >Variant
        <select id="variant">
          <option value="continuous-control">Continuous-render control</option>
          <option value="demand-candidate">Demand-render candidate</option>
        </select>
      </label>
      <label
        >Measurement
        <select id="duration">
          <option value="10000">10 seconds</option>
          <option value="3000">3 seconds</option>
        </select>
      </label>
      <div>
        <button id="runTrial" type="button">Run trial</button>
        <button id="download" type="button" disabled>Download JSON</button>
      </div>
      <div id="status" role="status" aria-live="polite">Ready</div>
      <pre id="result"></pre>
    </aside>
    <script type="module" src="./mission-render-demand-fixture.mjs"></script>
  </body>
</html>
