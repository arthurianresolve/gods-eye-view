<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S52 idle font wake diagnostic</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07111b;
        color: #d8e6f2;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #viewer,
      #replacement-viewer {
        position: fixed;
        inset: 0;
      }
      #replacement-viewer {
        z-index: 1;
      }
      #controls {
        position: fixed;
        z-index: 20;
        top: 10px;
        left: 10px;
        width: 360px;
        min-height: 98px;
        box-sizing: border-box;
        padding: 8px 10px;
        overflow: hidden;
        border: 1px solid #2a536c;
        border-radius: 6px;
        background: rgb(5 15 25 / 94%);
      }
      #controls p {
        margin: 4px 0;
      }
      #run,
      #download {
        margin-right: 6px;
      }
      #status {
        min-height: 1.4em;
      }
      #result {
        position: fixed;
        left: 10px;
        bottom: 10px;
        width: 360px;
        max-height: 90px;
        overflow: auto;
        margin: 0;
        padding: 6px;
        box-sizing: border-box;
        background: rgb(5 15 25 / 90%);
        white-space: pre-wrap;
      }
      .cesium-viewer-bottom {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="replacement-viewer"></div>
    <aside id="controls">
      <strong>Idle world-overlay font wake</strong>
      <p>
        Loads a same-origin, pinned local font after the Cesium scene parks.
      </p>
      <button id="run" type="button">Run check</button>
      <button id="download" type="button" disabled>Download JSON</button>
      <span id="status" role="status">Ready</span>
    </aside>
    <pre id="result"></pre>
    <div id="credits"></div>
    <script type="module" src="./font-wake.mjs"></script>
  </body>
</html>
